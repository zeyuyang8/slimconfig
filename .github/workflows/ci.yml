name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pinned to an exact tag: setup-uv stopped publishing a floating major (`@v10` 404s).
          # No uv.lock here (a library pins nothing), so key the cache on pyproject.toml —
          # otherwise setup-uv warns that the cache can never be invalidated.
          cache-dependency-glob: pyproject.toml
          # Both matrix legs resolve the same glob, so without a suffix they race for one
          # cache key and the loser warns "unable to reserve cache".
          cache-suffix: ${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
