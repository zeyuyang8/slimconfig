# Publish to PyPI on a version tag, via trusted publishing (OIDC) — no API token is stored here.
#
# One-time setup on PyPI — the project exists, so add the publisher under the project itself
# (https://pypi.org/manage/project/slimconfig/settings/publishing/):
#   Owner: zeyuyang8 | Repository: slimconfig | Workflow: publish.yml | Environment: pypi
# Without it the publish job dies at the OIDC exchange with `invalid-publisher`.
# Then release with:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match slimconfig.__version__ (the build reads the version from there) — the check
# job below fails the release if they disagree.

name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # No uv.lock here (a library pins nothing), so key the cache on pyproject.toml —
          # otherwise setup-uv warns that the cache can never be invalidated.
          cache-dependency-glob: pyproject.toml
      - name: Tag matches slimconfig.__version__
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' src/slimconfig/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || { echo "tag $tag != __version__ $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mint the OIDC token PyPI trusted publishing verifies
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version uploaded by hand (`uv build && twine upload`) is already on PyPI by the time
          # the tag lands; skip those files instead of failing the run.
          skip-existing: true
